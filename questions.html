<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questions — SOPHI Investor Deal Room</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght,ital@9..144,400;9..144,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
<div class="watermark" data-mark="CONFIDENTIAL · partner@fund.com    CONFIDENTIAL · partner@fund.com"></div>
<div class="app-shell">
  <aside class="side-nav" id="side-nav"></aside>
  <main class="main" style="position:relative; z-index:2;">

    <header class="page-header">
      <div class="ph-icon" style="background:#E8F4FF; color:#0B5394;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div class="ph-body">
        <div class="ph-eyebrow">Diligence</div>
        <h1 class="ph-title">Questions.<br>Threaded diligence with Joshua.</h1>
        <p class="ph-lede">
          Post a diligence question. Joshua responds within one business day. Threads stay private to your firm — no other investor sees the pane, and every message is logged against your access record.
        </p>
      </div>
    </header>

    <div class="thread-grid">
      <div class="thread-list" id="thread-list"></div>
      <div class="thread-pane" id="thread-pane"></div>
    </div>

  </main>
</div>

<script>
  const THREADS = [
    {
      id: 'moic',
      date: 'Aug 26',
      title: 'Reconciling the 2.49× organic MOIC vs. 7.26× v3 case',
      preview: 'Trying to understand how much weight to put on the v3 upside vs. what the current…',
      meta: '2 messages · Joshua last replied 2d ago',
      messages: [
        {author: 'Emma Reyes', role: 'Prospective investor', date: 'Aug 24 · 3:14 PM',
         body: 'Working through both valuations. The organic MOIC of 2.49× is defensible on Blend Wealth alone, but the v3 case at 7.26× depends on landing 34 accounts across six markets you have not yet entered at scale. What is the actual milestone that would move a diligent LP from pricing this closer to organic vs. closer to v3? Is there a specific site-count or ARR trigger?'},
        {author: 'Joshua Casey', role: 'Founder', date: 'Aug 26 · 9:02 AM',
         body: 'Fair question, and the honest answer is that most sophisticated seed LPs will price the deal roughly between the two — closer to the organic number until v3 execution shows up in the data. The specific trigger I would use in your position: (1) 3 paying license contracts at $1K+/site/month with 90-day retention, and (2) first non-anchor-market SOM cohort hitting Y1 revenue plan. Those two together retire Risk #4 (licensing GTM) and Risk #8 (moat) simultaneously. If both fire inside 18 months, the v3 pricing becomes the honest anchor. If neither fires by month 18, the organic is the honest anchor — and I would tell you the same thing over coffee.'}
      ]
    },
    {
      id: 'ebit',
      date: 'Aug 25',
      title: '25% terminal EBIT margin — is that structural or aspirational?',
      preview: 'Both DCFs run 25% EBIT in year 5. Some parking comps show single-digit operating…',
      meta: '3 messages · Joshua last replied 3d ago',
      messages: [
        {author: 'David Park', role: 'Prospective investor', date: 'Aug 24 · 6:41 PM',
         body: 'Both DCFs run 25% EBIT in Y5. SP+ and the NAICS parking comps show operating margins in the mid- to high-single-digits at scale. What is SOPHI doing structurally that lets it operate at 3–4× the comp margin, and how much of that is real vs. how much is a small-company margin that compresses as you scale?'},
        {author: 'Joshua Casey', role: 'Founder', date: 'Aug 25 · 8:15 AM',
         body: 'The gap is real but I will be direct about how much is structural. SOPHI\'s current sites operate in the 18–25% band because (1) we run premium-priced properties where labor is a smaller share of revenue than the parking-services average, (2) our tech attach — SMS, dispatch — reduces manager and dispatch overhead per site, and (3) we do not carry the corporate cost load of a public roll-up. Of that spread, I would attribute roughly 60% to the mix effect (premium sites), 25% to the OS, and 15% to being small and not yet carrying enterprise G&A. As we scale toward 15 markets, I expect 300–500 bps of compression as we build the G&A layer, which is why the DCF uses 25% — a modest step down from where we operate today, and honest about the compression coming.'},
        {author: 'David Park', role: 'Prospective investor', date: 'Aug 25 · 10:33 AM',
         body: 'Appreciated. That is the right level of honesty on the decomposition. Would like the Y5 SG&A build-up in the Blend Wealth workbook when NDA is signed.'}
      ]
    },
    {
      id: 'triumvirate',
      date: 'Aug 23',
      title: 'The Triumvirate hiring plan for markets 3–6',
      preview: 'The org model reads well. Practical question — what is the hiring ladder, comp band…',
      meta: '2 messages · Joshua last replied 5d ago',
      messages: [
        {author: 'Sarah Chen', role: 'Prospective investor', date: 'Aug 22 · 2:11 PM',
         body: 'The Orchestrator / Comptroller / Cultivator model is thoughtful and reads well on paper. Practical question — what is the hiring ladder, the comp band for each seat, and how do you plan to run the first triumvirate for a non-Charlotte market when the founder cannot be present daily? Related — how are you thinking about Risk #2 in the Risk section?'},
        {author: 'Joshua Casey', role: 'Founder', date: 'Aug 23 · 9:47 AM',
         body: 'Great question — it is the risk I think about most. Comp bands: Orchestrator $85–110K base + performance, Comptroller $70–90K base, Cultivator $60–80K base + a small revenue share on retention outcomes. The first non-Charlotte triumvirate is planned for Indianapolis. My commitment for that launch: I am on-site 3 days per week for the first 60 days, then dropping to 1 day per week by month 4. The full playbook we are testing right now in Charlotte — 25+ documented SOPs by role — has to be complete before the Indy Orchestrator arrives. If it is not complete, we delay the Indy launch. That is the guardrail against the exact failure mode you are asking about.'}
      ]
    }
  ];

  let activeId = THREADS[0].id;

  function renderList() {
    const list = document.getElementById('thread-list');
    list.innerHTML = THREADS.map(t => `
      <button class="thread-item${t.id === activeId ? ' active' : ''}" data-id="${t.id}">
        <div class="ti-top">
          <div class="ti-title">${t.title}</div>
          <div class="ti-date">${t.date}</div>
        </div>
        <div class="ti-meta">${t.meta}</div>
      </button>
    `).join('');
    list.querySelectorAll('.thread-item').forEach(el => {
      el.addEventListener('click', () => { activeId = el.getAttribute('data-id'); renderAll(); });
    });
  }

  function renderPane() {
    const t = THREADS.find(x => x.id === activeId);
    const pane = document.getElementById('thread-pane');
    pane.innerHTML = `
      <h2 class="tp-title">${t.title}</h2>
      ${t.messages.map(m => `
        <div class="thread-msg">
          <div class="tm-head">
            <div class="tm-author">${m.author}<span class="tm-role"> · ${m.role}</span></div>
            <div class="tm-date">${m.date}</div>
          </div>
          <p>${m.body}</p>
        </div>
      `).join('')}
      <div class="thread-input">
        <textarea placeholder="Reply to this thread… Joshua typically responds within one business day."></textarea>
        <div class="ti-foot">
          <div class="ti-hint">Messages are logged against your firm's access record. Only Joshua and your firm see this thread.</div>
          <button class="chip chip-blue" style="padding:8px 16px; font-size:13px; cursor:pointer; border:none;" onclick="const p=this.closest('.thread-pane').querySelector('textarea'); if(p.value.trim()){this.textContent='Sent ✓'; setTimeout(()=>{this.textContent='Send reply'; p.value='';},1600);}">Send reply</button>
        </div>
      </div>
    `;
  }

  function renderAll() { renderList(); renderPane(); }
  renderAll();
</script>
<script src="./assets/shell.js?v=20260828b"></script>
<script>window.SOPHI_SHELL.mount('questions.html');</script>
</body>
</html>
